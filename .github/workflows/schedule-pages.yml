name: Deploy schedule site

on:
  push:
    branches:
      - main
    paths:
      - "schedule-site/**"
      - ".github/workflows/schedule-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: schedule-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload schedule artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: schedule-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
