<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --schedule-bg: #f7f8fb;
      --schedule-surface: #ffffff;
      --schedule-surface-soft: #eef2f7;
      --schedule-surface-warm: #fffaf0;
      --schedule-text: #172033;
      --schedule-muted: #657287;
      --schedule-border: #d9e0ea;
      --schedule-border-strong: #c4d0dd;
      --schedule-accent: #0f766e;
      --schedule-accent-dark: #115e59;
      --schedule-gold: #f5b02e;
      --schedule-danger: #b91c1c;
      --league-monday: #0f766e;
      --league-comp: #2563eb;
      --league-uber: #be123c;
      --schedule-radius: 8px;
      --schedule-shadow: 0 10px 24px rgba(23, 32, 51, 0.08);
      --schedule-focus: 0 0 0 3px rgba(15, 118, 110, 0.22);
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 0;
      background:
        linear-gradient(180deg, #eef7f5 0, var(--schedule-bg) 240px),
        var(--schedule-bg);
      color: var(--schedule-text);
    }

    body {
      font-size: 16px;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .schedule-app {
      width: 100%;
      min-height: 420px;
      padding: 20px;
    }

    .schedule-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .schedule-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .schedule-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 700;
    }

    .schedule-count {
      color: var(--schedule-muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(180px, 1.3fr) repeat(4, minmax(130px, 1fr)) auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--schedule-border);
      border-top: 4px solid var(--schedule-accent);
      border-radius: var(--schedule-radius);
      background: var(--schedule-surface);
      box-shadow: 0 12px 30px rgba(23, 32, 51, 0.1);
    }

    .filter-toggle {
      display: none;
    }

    .filter-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      grid-column: 1 / -1;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid #f3d58d;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--schedule-surface-warm), #fff);
      color: var(--schedule-muted);
      font-size: 13px;
      font-weight: 700;
    }

    .filter-summary-label {
      color: var(--schedule-text);
    }

    .filter-summary-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border: 1px solid var(--schedule-border-strong);
      border-radius: 999px;
      background: #fff;
      color: var(--schedule-text);
      font-size: 12px;
      font-weight: 700;
    }

    .field {
      min-width: 0;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--schedule-muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 44px;
      padding: 9px 10px;
      border: 1px solid var(--schedule-border);
      border-radius: 6px;
      background: #fff;
      color: var(--schedule-text);
    }

    .field input:focus,
    .field select:focus,
    .button:focus {
      outline: none;
      box-shadow: var(--schedule-focus);
      border-color: var(--schedule-accent);
    }

    .button {
      min-height: 44px;
      padding: 9px 14px;
      border: 1px solid var(--schedule-accent);
      border-radius: 6px;
      background: var(--schedule-accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    .button:hover {
      background: var(--schedule-accent-dark);
      border-color: var(--schedule-accent-dark);
    }

    .button.secondary {
      background: #fff;
      color: var(--schedule-accent-dark);
    }

    .button.secondary:hover {
      background: var(--schedule-surface-soft);
    }

    .button.subtle {
      border-color: var(--schedule-border);
      background: #fff;
      color: var(--schedule-muted);
    }

    .button.subtle.active {
      border-color: var(--schedule-accent);
      background: var(--schedule-surface-warm);
      color: var(--schedule-accent-dark);
    }

    .calendar-link {
      text-align: center;
      text-decoration: none;
    }

    .state {
      padding: 22px;
      border: 1px solid var(--schedule-border);
      border-radius: var(--schedule-radius);
      background: var(--schedule-surface);
      text-align: center;
      box-shadow: var(--schedule-shadow);
    }

    .state strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .state p {
      margin: 0 0 14px;
      color: var(--schedule-muted);
    }

    .schedule-list {
      display: grid;
      gap: 16px;
    }

    .date-group {
      border: 1px solid var(--schedule-border);
      border-radius: var(--schedule-radius);
      overflow: hidden;
      background: var(--schedule-surface);
      box-shadow: var(--schedule-shadow);
    }

    .date-heading {
      display: block;
      padding: 13px 16px;
      background: linear-gradient(90deg, var(--schedule-surface-soft), #fff);
      border-bottom: 1px solid var(--schedule-border);
      font-weight: 700;
    }

    .schedule-row,
    .schedule-header {
      display: grid;
      grid-template-columns: 110px minmax(220px, 1.5fr) minmax(150px, 0.8fr) minmax(120px, 0.7fr);
      gap: 14px;
      align-items: center;
      padding: 13px 16px;
    }

    .schedule-header {
      color: var(--schedule-muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      border-bottom: 1px solid var(--schedule-border);
    }

    .schedule-row + .schedule-row {
      border-top: 1px solid var(--schedule-border);
    }

    .schedule-row {
      border-left: 5px solid var(--schedule-border);
      transition: background-color 140ms ease, box-shadow 140ms ease;
    }

    .schedule-row:hover {
      box-shadow: inset 0 0 0 999px rgba(255, 255, 255, 0.28);
    }

    .schedule-row.league-monday {
      border-left-color: var(--league-monday);
      background: linear-gradient(90deg, rgba(15, 118, 110, 0.08), #fff 42%);
    }

    .schedule-row.league-wed-comp {
      border-left-color: var(--league-comp);
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.08), #fff 42%);
    }

    .schedule-row.league-wed-uber {
      border-left-color: var(--league-uber);
      background: linear-gradient(90deg, rgba(190, 18, 60, 0.08), #fff 42%);
    }

    .game-time {
      font-weight: 700;
      white-space: nowrap;
    }

    .league-chip.mobile-league-chip {
      display: none;
    }

    .game-teams {
      min-width: 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .game-meta {
      margin-top: 3px;
      color: var(--schedule-muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .league-chip {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      margin-right: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--schedule-surface-soft);
      color: var(--schedule-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .league-chip.league-monday {
      background: rgba(15, 118, 110, 0.12);
      color: var(--league-monday);
    }

    .league-chip.league-wed-comp {
      background: rgba(37, 99, 235, 0.12);
      color: var(--league-comp);
    }

    .league-chip.league-wed-uber {
      background: rgba(190, 18, 60, 0.12);
      color: var(--league-uber);
    }

    .location-link {
      color: var(--schedule-accent-dark);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    .location-text {
      overflow-wrap: anywhere;
    }

    .results {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .result-pill,
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--schedule-surface-soft);
      color: var(--schedule-muted);
      font-size: 13px;
      font-weight: 700;
    }

    .result-pill {
      border: 1px solid currentColor;
      background: #fff;
    }

    .skeleton {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--schedule-border);
      border-radius: var(--schedule-radius);
      background: var(--schedule-surface);
      box-shadow: var(--schedule-shadow);
    }

    .skeleton-line {
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e6ebf2, #f5f7fa, #e6ebf2);
      background-size: 220% 100%;
      animation: shimmer 1200ms linear infinite;
    }

    .skeleton-line.short {
      width: 34%;
    }

    .skeleton-line.medium {
      width: 64%;
    }

    @keyframes shimmer {
      from {
        background-position: 220% 0;
      }
      to {
        background-position: -220% 0;
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters .button {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      .schedule-app {
        padding: 4px;
      }

      .schedule-topbar {
        align-items: center;
        flex-direction: row;
        gap: 8px;
        margin-bottom: 8px;
      }

      .schedule-title {
        font-size: 21px;
      }

      .schedule-count {
        font-size: 12px;
        white-space: normal;
      }

      .filters {
        grid-template-columns: 1fr auto;
        gap: 6px;
        margin-bottom: 8px;
        padding: 6px;
        z-index: 2;
      }

      .field label {
        margin-bottom: 3px;
        font-size: 12px;
      }

      .field input,
      .field select,
      .button {
        min-height: 38px;
        padding: 6px 8px;
        font-size: 14px;
      }

      .filter-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        align-self: end;
        width: 44px;
        min-width: 44px;
        padding: 0;
      }

      .filters .field:first-child {
        grid-column: 1;
      }

      .filters .collapsible-filter,
      .filters #clearFilters,
      .filters #saveFavorite,
      .filters #calendarLink {
        grid-column: 1 / -1;
      }

      .filters:not(.expanded) .collapsible-filter,
      .filters:not(.expanded) #clearFilters,
      .filters:not(.expanded) #saveFavorite,
      .filters:not(.expanded) #calendarLink {
        display: none;
      }

      .schedule-header {
        display: none;
      }

      .schedule-row {
        grid-template-columns: 48px minmax(0, 1fr) minmax(54px, auto);
        grid-template-rows: auto auto;
        gap: 2px 7px;
        align-items: center;
        padding: 6px 7px;
        border-left-width: 4px;
      }

      .date-heading {
        padding: 6px 8px;
        font-size: 13px;
      }

      .schedule-list {
        gap: 8px;
      }

      .game-time {
        grid-column: 1;
        grid-row: 1;
        font-size: 13px;
        white-space: normal;
      }

      .league-chip.mobile-league-chip {
        display: inline-flex;
        grid-column: 1;
        grid-row: 2;
        align-self: start;
        justify-self: start;
        margin-right: 0;
        margin-top: 1px;
        padding: 1px 5px;
        font-size: 10px;
        line-height: 1.1;
        white-space: nowrap;
      }

      .game-teams {
        font-size: 13px;
        line-height: 1.2;
      }

      .game-meta {
        display: none;
      }

      .game-location {
        justify-self: end;
        max-width: 82px;
        font-size: 12px;
        line-height: 1.15;
        text-align: right;
      }

      .location-link,
      .location-text {
        overflow-wrap: normal;
        word-break: normal;
      }

      .results {
        grid-column: 2 / 4;
        grid-row: 2;
        gap: 4px;
      }

      .result-pill,
      .status-pill {
        min-height: 24px;
        padding: 2px 7px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="schedule-app" aria-live="polite">
    <div class="schedule-shell">
      <div class="schedule-topbar">
        <h1 class="schedule-title">Schedule</h1>
        <div class="schedule-count" id="scheduleCount">Loading games...</div>
      </div>

      <form class="filters" id="filters" aria-label="Schedule filters">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" name="search" type="search" autocomplete="off" placeholder="Team or location">
        </div>

        <button class="button secondary filter-toggle" id="filterToggle" type="button" aria-controls="filters" aria-expanded="false" title="Show filters">Filter</button>

        <div class="field collapsible-filter hidden" id="leagueField">
          <label for="league">League</label>
          <select id="league" name="league">
            <option value="">All Leagues</option>
          </select>
        </div>

        <div class="field collapsible-filter">
          <label for="team">Team</label>
          <select id="team" name="team">
            <option value="">All Teams</option>
          </select>
        </div>

        <div class="field collapsible-filter">
          <label for="location">Location</label>
          <select id="location" name="location">
            <option value="">All Locations</option>
          </select>
        </div>

        <div class="field collapsible-filter hidden" id="divisionField">
          <label for="division">Division</label>
          <select id="division" name="division">
            <option value="">All Divisions</option>
          </select>
        </div>

        <div class="field collapsible-filter">
          <label for="range">Date Range</label>
          <select id="range" name="range">
            <option value="upcoming">Upcoming</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="next7">Next 7 Days</option>
            <option value="completed">Completed</option>
            <option value="all">All Games</option>
          </select>
        </div>

        <button class="button secondary" id="clearFilters" type="button">Clear</button>
        <button class="button subtle collapsible-filter" id="saveFavorite" type="button">Save Favourite</button>
        <a class="button secondary calendar-link hidden" id="calendarLink" href="#" target="_blank" rel="noopener noreferrer">Add Calendar</a>
        <div class="filter-summary" id="filterSummary" aria-live="polite"></div>
      </form>

      <section id="loadingState" class="skeleton" aria-label="Loading schedule">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line medium"></div>
      </section>

      <section id="errorState" class="state hidden">
        <strong>Unable to load the schedule.</strong>
        <p>Please try again.</p>
        <button class="button" id="retry" type="button">Retry</button>
      </section>

      <section id="emptyState" class="state hidden">
        <strong>No games match your filters.</strong>
        <p>Try a different team, location, date range, or search.</p>
        <button class="button secondary" id="clearEmpty" type="button">Clear Filters</button>
      </section>

      <section id="noDataState" class="state hidden">
        <strong>No schedule games are available.</strong>
        <p>Please check back soon.</p>
      </section>

      <section id="scheduleList" class="schedule-list hidden" aria-label="Games"></section>
    </div>
  </main>

  <script>
    const state = {
      games: [],
      filtered: [],
      filters: {
        search: "",
        team: "",
        location: "",
        league: "",
        division: "",
        range: "upcoming"
      },
      debounceId: null
    };

    const elements = {
      filters: document.getElementById("filters"),
      search: document.getElementById("search"),
      team: document.getElementById("team"),
      location: document.getElementById("location"),
      league: document.getElementById("league"),
      division: document.getElementById("division"),
      range: document.getElementById("range"),
      filterToggle: document.getElementById("filterToggle"),
      leagueField: document.getElementById("leagueField"),
      divisionField: document.getElementById("divisionField"),
      clearFilters: document.getElementById("clearFilters"),
      saveFavorite: document.getElementById("saveFavorite"),
      calendarLink: document.getElementById("calendarLink"),
      filterSummary: document.getElementById("filterSummary"),
      clearEmpty: document.getElementById("clearEmpty"),
      retry: document.getElementById("retry"),
      loadingState: document.getElementById("loadingState"),
      errorState: document.getElementById("errorState"),
      emptyState: document.getElementById("emptyState"),
      noDataState: document.getElementById("noDataState"),
      scheduleList: document.getElementById("scheduleList"),
      scheduleCount: document.getElementById("scheduleCount")
    };

    const SCHEDULE_API_URL = "https://www.gccvb.org/_functions/schedule";
    const FAVORITE_FILTER_KEY = "gccvbScheduleFavoriteFilters";

    elements.filters.addEventListener("change", handleFilterChange);
    elements.search.addEventListener("input", handleSearchInput);
    elements.clearFilters.addEventListener("click", clearFilters);
    elements.clearEmpty.addEventListener("click", clearFilters);
    elements.retry.addEventListener("click", loadSchedule);
    elements.filterToggle.addEventListener("click", toggleFilters);
    elements.saveFavorite.addEventListener("click", saveFavoriteFilters);

    loadSchedule();

    async function loadSchedule() {
      showState("loading");
      elements.scheduleCount.textContent = "Loading games...";

      try {
        const response = await fetch(SCHEDULE_API_URL, {
          headers: {
            accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`Schedule API failed with ${response.status}`);
        }

        const schedule = await response.json();
        state.games = Array.isArray(schedule.games) ? schedule.games : [];
        state.filters = {
          ...state.filters,
          ...getFavoriteFilters(),
          ...pickKnownFilters(getFiltersFromUrl())
        };

        hydrateControls();
        updateFavoriteButton();
        applyFilters(false);
      } catch (error) {
        console.error("Schedule load failed:", error);
        showState("error");
      }
    }

    function hydrateControls() {
      populateSelect(elements.team, getOptionsFromTeams(getGamesForTeamOptions()), "All Teams");
      populateSelect(elements.location, getUniqueValues(state.games, "location"), "All Locations");

      const leagues = getLeagueOptions(state.games);
      const divisions = getUniqueValues(state.games, "division");

      populateSelect(elements.league, leagues, "All Leagues");
      populateSelect(elements.division, divisions, "All Divisions");
      elements.leagueField.classList.toggle("hidden", leagues.length === 0);
      elements.divisionField.classList.toggle("hidden", divisions.length === 0);

      Object.entries(state.filters).forEach(([key, value]) => {
        if (elements[key]) {
          elements[key].value = value;
        }
      });
    }

    function handleFilterChange(event) {
      if (!event.target.name) {
        return;
      }

      state.filters[event.target.name] = event.target.value;
      if (event.target.name === "league") {
        state.filters.team = "";
        hydrateControls();
      }
      applyFilters(true);
    }

    function handleSearchInput(event) {
      window.clearTimeout(state.debounceId);
      state.filters.search = event.target.value;
      state.debounceId = window.setTimeout(() => applyFilters(true), 180);
    }

    function clearFilters() {
      state.filters = {
        search: "",
        team: "",
        location: "",
        league: "",
        division: "",
        range: "upcoming"
      };
      hydrateControls();
      applyFilters(true);
      updateFavoriteButton();
    }

    function applyFilters(announce) {
      state.filtered = state.games.filter((game) => {
        return matchesSearch(game)
          && matchesField(game, "location")
          && matchesField(game, "league")
          && matchesField(game, "division")
          && matchesTeam(game)
          && matchesRange(game);
      });

      render();
      updateFilterSummary();
      updateCalendarLink();

      if (announce) {
        syncFilterUrl();
      }
    }

    function matchesSearch(game) {
      const search = normalize(state.filters.search);
      if (!search) {
        return true;
      }

      return [
        game.teams,
        game.homeTeam,
        game.awayTeam,
        game.location,
        game.league,
        game.division
      ].some((value) => normalize(value).includes(search));
    }

    function matchesField(game, field) {
      const expected = normalize(state.filters[field]);
      return !expected || normalize(game[field]) === expected;
    }

    function matchesTeam(game) {
      const expected = normalize(state.filters.team);
      if (!expected) {
        return true;
      }

      return normalize(game.homeTeam) === expected
        || normalize(game.awayTeam) === expected;
    }

    function matchesRange(game) {
      const range = state.filters.range;
      const start = Number(game.startTimestamp);
      const now = new Date();
      const todayStart = startOfDay(now).getTime();
      const tomorrowStart = todayStart + dayMs();
      const nextDayStart = tomorrowStart + dayMs();
      const weekEnd = todayStart + (7 - now.getDay()) * dayMs();
      const nextSevenEnd = todayStart + 7 * dayMs();

      if (range === "all" || !start) {
        return true;
      }
      if (range === "today") {
        return start >= todayStart && start < tomorrowStart;
      }
      if (range === "week") {
        return start >= todayStart && start < weekEnd;
      }
      if (range === "next7") {
        return start >= todayStart && start < nextSevenEnd;
      }
      if (range === "completed") {
        return game.status === "completed" || start < todayStart;
      }

      return start >= todayStart || game.status === "upcoming";
    }

    function render() {
      elements.scheduleList.textContent = "";

      if (state.games.length === 0) {
        elements.scheduleCount.textContent = "0 games";
        showState("nodata");
        return;
      }

      if (state.filtered.length === 0) {
        elements.scheduleCount.textContent = `0 of ${state.games.length} games`;
        showState("empty");
        return;
      }

      elements.scheduleCount.textContent = `${state.filtered.length} of ${state.games.length} games`;
      elements.scheduleList.appendChild(renderGroups(groupByDate(state.filtered)));
      showState("list");
    }

    function renderGroups(groups) {
      const fragment = document.createDocumentFragment();

      groups.forEach((group) => {
        const section = document.createElement("article");
        section.className = "date-group";

        const heading = document.createElement("div");
        heading.className = "date-heading";

        const label = document.createElement("time");
        label.dateTime = group.dateISO || "";
        label.textContent = getFriendlyDate(group.dateISO, group.fallbackDate);
        heading.appendChild(label);
        section.appendChild(heading);

        const header = document.createElement("div");
        header.className = "schedule-header";
        ["Time", "Matchup", "Location", "Result / Status"].forEach((text) => {
          const cell = document.createElement("div");
          cell.textContent = text;
          header.appendChild(cell);
        });
        section.appendChild(header);

        group.games.forEach((game) => {
          section.appendChild(renderGame(game));
        });

        fragment.appendChild(section);
      });

      return fragment;
    }

    function renderGame(game) {
      const row = document.createElement("div");
      row.className = `schedule-row ${getLeagueClass(game.league)}`;

      const time = document.createElement("div");
      time.className = "game-time";
      const timeValue = document.createElement("span");
      timeValue.textContent = game.time || "Time TBD";
      time.appendChild(timeValue);

      const matchup = document.createElement("div");
      const teams = document.createElement("div");
      teams.className = "game-teams";
      teams.textContent = getDisplayTeams(game);
      matchup.appendChild(teams);

      const metaText = [game.league, game.division].filter(Boolean).join(" / ");
      if (metaText) {
        const meta = document.createElement("div");
        meta.className = "game-meta";
        const chip = document.createElement("span");
        chip.className = `league-chip ${getLeagueClass(game.league)}`;
        chip.textContent = game.league;
        meta.appendChild(chip);
        meta.appendChild(document.createTextNode(metaText.replace(game.league, "").replace(/^ \/ /, "")));
        matchup.appendChild(meta);
      }

      const location = document.createElement("div");
      location.className = "game-location";
      if (game.location && game.mapUrl) {
        const link = document.createElement("a");
        link.className = "location-link";
        link.href = game.mapUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = game.location;
        location.appendChild(link);
      } else {
        const text = document.createElement("span");
        text.className = "location-text";
        text.textContent = game.location || "Location TBD";
        location.appendChild(text);
      }

      const results = document.createElement("div");
      results.className = "results";
      renderResults(game).forEach((node) => results.appendChild(node));

      row.append(time, matchup, location);

      if (game.league) {
        const mobileChip = document.createElement("span");
        mobileChip.className = `league-chip mobile-league-chip ${getLeagueClass(game.league)}`;
        mobileChip.textContent = game.league;
        row.appendChild(mobileChip);
      }

      row.appendChild(results);
      return row;
    }

    function renderResults(game) {
      if (Array.isArray(game.results) && game.results.length > 0) {
        return game.results.map((result) => {
          const pill = document.createElement("span");
          pill.className = "result-pill";
          if (result.color) {
            pill.style.color = result.color;
          }
          pill.textContent = result.label;
          pill.title = `${result.label} result`;
          return pill;
        });
      }

      const status = document.createElement("span");
      status.className = "status-pill";
      status.textContent = getStatusLabel(game.status);
      return [status];
    }

    function groupByDate(games) {
      const map = new Map();

      games.forEach((game) => {
        const key = game.dateISO || game.date || "Date TBD";
        if (!map.has(key)) {
          map.set(key, {
            dateISO: game.dateISO,
            fallbackDate: game.date || "Date TBD",
            games: []
          });
        }
        map.get(key).games.push(game);
      });

      return Array.from(map.values());
    }

    function populateSelect(select, values, defaultLabel) {
      const current = select.value;
      select.textContent = "";
      select.appendChild(new Option(defaultLabel, ""));
      values.forEach((value) => select.appendChild(new Option(value, value)));

      if (values.includes(current) || current === "") {
        select.value = current;
      }
    }

    function getOptionsFromTeams(games) {
      const values = new Set();
      games.forEach((game) => {
        if (game.homeTeam) values.add(game.homeTeam);
        if (game.awayTeam) values.add(game.awayTeam);
      });

      return Array.from(values).sort(compareTeamOptions);
    }

    function getGamesForTeamOptions() {
      const league = normalize(state.filters.league);
      if (!league) {
        return state.games;
      }

      return state.games.filter((game) => normalize(game.league) === league);
    }

    function toggleFilters() {
      const isExpanded = elements.filters.classList.toggle("expanded");
      elements.filterToggle.setAttribute("aria-expanded", String(isExpanded));
      elements.filterToggle.textContent = isExpanded ? "Hide" : "Filter";
      elements.filterToggle.title = isExpanded ? "Hide filters" : "Show filters";
    }

    function getUniqueValues(games, field) {
      const values = new Set();
      games.forEach((game) => {
        if (game[field]) {
          values.add(game[field]);
        }
      });

      return Array.from(values).sort((first, second) => first.localeCompare(second));
    }

    function getLeagueOptions(games) {
      const preferredOrder = ["Monday", "Wed Comp", "Wed Uber"];
      const values = getUniqueValues(games, "league");
      const known = preferredOrder.filter((league) => values.includes(league));
      const other = values.filter((league) => !preferredOrder.includes(league));

      return known.concat(other);
    }

    function compareTeamOptions(first, second) {
      const firstName = getTeamSortName(first);
      const secondName = getTeamSortName(second);
      const nameComparison = firstName.localeCompare(secondName);

      if (nameComparison !== 0) {
        return nameComparison;
      }

      return first.localeCompare(second);
    }

    function getTeamSortName(value) {
      return String(value || "").replace(/^(Monday|Wednesday)\s+/i, "").trim();
    }

    function showState(name) {
      elements.loadingState.classList.toggle("hidden", name !== "loading");
      elements.errorState.classList.toggle("hidden", name !== "error");
      elements.emptyState.classList.toggle("hidden", name !== "empty");
      elements.noDataState.classList.toggle("hidden", name !== "nodata");
      elements.scheduleList.classList.toggle("hidden", name !== "list");
    }

    function getFriendlyDate(dateISO, fallback) {
      if (!dateISO) {
        return fallback || "Date TBD";
      }

      const date = parseLocalDate(dateISO);
      if (!date) {
        return fallback || dateISO;
      }

      const today = startOfDay(new Date());
      const tomorrow = new Date(today.getTime() + dayMs());

      if (date.getTime() === today.getTime()) {
        return "Today";
      }
      if (date.getTime() === tomorrow.getTime()) {
        return "Tomorrow";
      }

      return new Intl.DateTimeFormat("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).format(date);
    }

    function getDisplayTeams(game) {
      if (game.displayTeams) {
        return game.displayTeams;
      }

      if (game.homeTeam && game.awayTeam) {
        return `${game.homeTeam} vs ${game.awayTeam}`;
      }

      return String(game.teams || "Teams TBD").replace(/\b(Monday|Wednesday|Wed Comp|Wed Uber)\s+/gi, "");
    }

    function parseLocalDate(dateISO) {
      const parts = String(dateISO || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!parts) {
        return null;
      }

      return new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
    }

    function getStatusLabel(status) {
      if (status === "completed") return "Completed";
      if (status === "pending") return "Pending";
      return "Upcoming";
    }

    function pickKnownFilters(filters) {
      const picked = {};
      Object.keys(state.filters).forEach((key) => {
        if (typeof filters[key] === "string") {
          picked[key] = filters[key];
        }
      });
      return picked;
    }

    function getFiltersFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const filters = {};

      ["search", "team", "location", "league", "division", "range"].forEach((key) => {
        if (params.has(key)) {
          filters[key] = params.get(key) || "";
        }
      });

      return filters;
    }

    function syncFilterUrl() {
      const params = new URLSearchParams();

      Object.entries(state.filters).forEach(([key, value]) => {
        if (value && !(key === "range" && value === "upcoming")) {
          params.set(key, value);
        }
      });

      const query = params.toString();
      const nextUrl = query ? `${window.location.pathname}?${query}` : window.location.pathname;
      window.history.replaceState({}, "", nextUrl);
    }

    function saveFavoriteFilters() {
      const favorite = {
        search: state.filters.search,
        league: state.filters.league,
        team: state.filters.team,
        location: state.filters.location,
        division: state.filters.division,
        range: state.filters.range
      };

      setFavoriteStorage(JSON.stringify(favorite));
      updateFavoriteButton(true);
    }

    function getFavoriteFilters() {
      try {
        const storedValue = getFavoriteStorage() || "{}";
        const stored = JSON.parse(storedValue);
        return pickKnownFilters(stored);
      } catch (error) {
        return {};
      }
    }

    function updateFavoriteButton(justSaved = false) {
      const hasFavorite = Boolean(getFavoriteStorage());
      elements.saveFavorite.classList.toggle("active", hasFavorite || justSaved);
      elements.saveFavorite.textContent = justSaved ? "Saved" : "Save Favourite";

      if (justSaved) {
        window.setTimeout(() => {
          elements.saveFavorite.textContent = "Save Favourite";
        }, 1400);
      }
    }

    function updateFilterSummary() {
      elements.filterSummary.textContent = "";
      elements.filterSummary.appendChild(makeSummaryLabel("Filter:"));

      formatCurrentFilters(state.filters).forEach((value) => {
        const chip = document.createElement("span");
        chip.className = "filter-summary-chip";
        chip.textContent = value;
        elements.filterSummary.appendChild(chip);
      });
    }

    function makeSummaryLabel(text) {
      const label = document.createElement("span");
      label.className = "filter-summary-label";
      label.textContent = text;
      return label;
    }

    function formatCurrentFilters(filters) {
      const parts = [
        filters.search ? `Search "${filters.search}"` : "",
        filters.league ? `League: ${filters.league}` : "",
        filters.team ? `Team: ${filters.team}` : "",
        filters.location ? `Location: ${filters.location}` : "",
        filters.division ? `Division: ${filters.division}` : "",
        getRangeLabel(filters.range)
      ].filter(Boolean);

      return parts.length > 0 ? parts : ["Upcoming"];
    }

    function updateCalendarLink() {
      if (!state.filters.team) {
        elements.calendarLink.classList.add("hidden");
        elements.calendarLink.removeAttribute("href");
        return;
      }

      const params = new URLSearchParams();
      params.set("team", state.filters.team);

      if (state.filters.league) {
        params.set("league", state.filters.league);
      }

      const path = `www.gccvb.org/_functions/calendar?${params.toString()}`;
      elements.calendarLink.href = `webcal://${path}`;
      elements.calendarLink.classList.remove("hidden");
      elements.calendarLink.title = `Subscribe to ${state.filters.team} games`;
    }

    function getRangeLabel(range) {
      const labels = {
        upcoming: "Upcoming",
        today: "Today",
        week: "This Week",
        next7: "Next 7 Days",
        completed: "Completed",
        all: "All Games"
      };

      return labels[range] || "";
    }

    function setFavoriteStorage(value) {
      try {
        window.localStorage.setItem(FAVORITE_FILTER_KEY, value);
      } catch (error) {
        console.warn("Unable to save favourite filters in localStorage.", error);
      }

      document.cookie = `${FAVORITE_FILTER_KEY}=${encodeURIComponent(value)}; max-age=31536000; path=/; samesite=lax`;
    }

    function getFavoriteStorage() {
      try {
        const localValue = window.localStorage.getItem(FAVORITE_FILTER_KEY);
        if (localValue) {
          return localValue;
        }
      } catch (error) {
        console.warn("Unable to read favourite filters from localStorage.", error);
      }

      return getCookie(FAVORITE_FILTER_KEY);
    }

    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find((part) => part.startsWith(`${name}=`))
        ?.split("=")
        .slice(1)
        .join("=") || "";
    }

    function getLeagueClass(league) {
      const value = normalize(league).replace(/\s+/g, "-");
      if (value === "monday") return "league-monday";
      if (value === "wed-comp") return "league-wed-comp";
      if (value === "wed-uber") return "league-wed-uber";
      return "";
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function dayMs() {
      return 24 * 60 * 60 * 1000;
    }

  </script>
</body>
</html>
